name: Terraform CI
on:
  pull_request:
    branches:
      - master
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task2/envs/dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Recreate secret file
        run: |
          mkdir -p /workspace
          echo "${{ secrets.AUTHORIZED_KEY_JSON_BASE64 }}" | base64 --decode > /workspace/authorized_key.json

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init

      - run: terraform validate

      - run: terraform plan -var-file=dev.tfvars -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: task2/envs/dev/tfplan

  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task2/envs/dev
    needs: plan
    environment: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: task2/envs/dev

      - name: Recreate secret file
        run: |
          mkdir -p /workspace
          echo "${{ secrets.AUTHORIZED_KEY_JSON_BASE64 }}" | base64 --decode > /workspace/authorized_key.json

      - uses: hashicorp/setup-terraform@v4

      - run: terraform init

      - run: terraform apply -auto-approve tfplan
